name: iventory
description: "Inventory Management"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  uuid: ^4.4.0
  path_provider: ^2.1.3
  path: ^1.9.0
  crypto: ^3.0.3
  camera: ^0.12.2
  geolocator: ^13.0.2
  sqflite: ^2.4.6
  sqflite_common_ffi: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Geist
      fonts: 
        - asset: font/Geist-VariableFont_wght.ttf